name: Build and Package Jumperless GUI App

on:
  push:
    branches: [ main, Merge-with-xtermjs ]
    tags: [ 'gui-v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  DISABLE_MACOS_DMG: "true"
  DISABLE_MACOS_NOTARIZATION: "false"
  
jobs:
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds for GUI
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            artifact-name: "JumperlessGUI-Linux-x64"
            executable-name: "JumperlessGUI"
            icon-path: "assets/icons/icon.png"
            
          # macOS builds for GUI (Intel)
          - os: macos-13
            platform: macos
            arch: x64
            artifact-name: "JumperlessGUI-macOS-Intel"
            executable-name: "JumperlessGUI"
            icon-path: "assets/icons/icon.icns"
            
          # macOS builds for GUI (Apple Silicon)
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact-name: "JumperlessGUI-macOS-Apple-Silicon"
            executable-name: "JumperlessGUI"
            icon-path: "assets/icons/icon.icns"
            
          # Windows builds for GUI
          - os: windows-latest
            platform: windows
            arch: x64
            artifact-name: "JumperlessGUI-Windows-x64"
            executable-name: "JumperlessGUI"
            icon-path: "assets/icons/icon.ico"

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install uv (fast Python package manager)
      run: |
        python -m pip install --upgrade pip
        pip install uv
        
    - name: Install system dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libxss1 \
          libgconf-2-4 \
          libxrandr2 \
          libatk1.0-0 \
          libgtk-3-0 \
          libgbm-dev \
          libxss1 \
          libnss3-dev \
          libdrm2 \
          libxcomposite1 \
          libxdamage1 \
          libxext6 \
          libxfixes3 \
          libxrandr2 \
          libxrender1 \
          libxtst6 \
          libxi6 \
          libxcursor1

    - name: Install dependencies with uv (macOS - Universal binaries)
      if: matrix.platform == 'macos'
      run: |
        # Set environment variables for universal binary builds
        export ARCHFLAGS="-arch x86_64 -arch arm64"
        export _PYTHON_HOST_PLATFORM="macosx-10.9-universal2"
        echo "Installing dependencies with universal binary support..."
        
        # Install pure Python packages first
        uv pip install --system beautifulsoup4 packaging requests pyduinocli
        
        # Install packages with C extensions - force rebuild from source for universal binaries
        # Note: Using pip directly instead of uv for --no-binary flag
        python -m pip install --no-cache-dir --no-binary :all: psutil pyserial
        
        # Install GUI-specific dependencies (if prebuilt wheels are universal)
        uv pip install --system PySide6>=6.6.0 websockets>=12.0
        
        # Install remaining requirements
        uv pip install --system -r PackagingApps/packagerRequirements.txt
        
    - name: Install dependencies with uv (Linux)
      if: matrix.platform == 'linux'
      run: |
        uv pip install --system -r requirements.txt
        uv pip install --system -r PackagingApps/packagerRequirements.txt
        # Ensure GUI-specific dependencies are installed
        uv pip install --system PySide6>=6.6.0 websockets>=12.0
    
    - name: Install dependencies (Windows)
      if: matrix.platform == 'windows'
      run: |
        # Use regular pip for Windows to avoid uv compatibility issues with x86
        python -m pip install -r requirements.txt
        python -m pip install -r PackagingApps/packagerRequirements.txt
        # Ensure GUI-specific dependencies are installed
        python -m pip install PySide6>=6.6.0 websockets>=12.0
    
    - name: Set up environment variables
      shell: bash
      run: |
        # Set UPX_DISABLE to avoid compression issues
        echo "UPX_DISABLE=1" >> $GITHUB_ENV
        
    - name: Create version info (Windows)
      if: matrix.platform == 'windows'
      run: |
        python Scripts/create_version_info.py
        
    - name: Copy assets to NewApp directory (if not exists)
      shell: bash
      run: |
        # Ensure NewApp directories exist
        mkdir -p NewApp/assets/xterm
        mkdir -p NewApp/fonts
        
        # Copy any existing fonts to NewApp/fonts
        if [ -f "assets/fonts/Iosevka*.ttf" ]; then
          cp assets/fonts/*.ttf NewApp/fonts/ || true
        fi
        
        # Note: xterm.js assets should be downloaded separately or included in repo
        echo "GUI asset directories prepared"
    
    - name: Build GUI executable with PyInstaller
      run: |
        python -m PyInstaller JumperlessGUI.spec \
          --clean \
          --noconfirm \
          --log-level INFO
          
    - name: Verify GUI build
      shell: bash
      run: |
        if [ "${{ matrix.platform }}" == "windows" ]; then
          ls -la "dist/JumperlessGUI/"
          test -f "dist/JumperlessGUI/JumperlessGUI.exe"
        elif [ "${{ matrix.platform }}" == "macos" ]; then
          ls -la "dist/"
          test -d "dist/JumperlessGUI.app"
        else
          ls -la "dist/JumperlessGUI/"
          test -f "dist/JumperlessGUI/JumperlessGUI"
        fi
        
    - name: Package GUI application
      run: |
        python Scripts/package_app.py \
          --platform ${{ matrix.platform }} \
          --arch ${{ matrix.arch }} \
          --executable-name ${{ matrix.executable-name }} \
          --icon-path ${{ matrix.icon-path }} \
          --version-suffix gui \
          --main-script JumperlessWokwiBridge_GUI.py
        
    - name: Run basic smoke test for GUI
      run: |
        python Scripts/smoke_test.py --platform ${{ matrix.platform }} --gui-mode
        
    - name: Upload GUI build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          builds/${{ matrix.platform }}/
          !builds/**/*.pyc
          !builds/**/__pycache__/
        retention-days: 90
        compression-level: 6
        
    - name: Upload GUI to release (if tag)
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/gui-v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          builds/${{ matrix.platform }}/*
        tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('gui-dev-{0}', github.sha) }}"
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job to create a combined GUI release with all platforms
  gui-release:
    needs: build-gui
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/gui-v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all GUI artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: JumperlessGUI-*
        path: gui-artifacts
        
    - name: Create combined GUI release info
      run: |
        echo "# Jumperless Bridge GUI Release" > RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "This release includes the Qt GUI version of Jumperless Bridge with:" >> RELEASE_NOTES.md
        echo "- Modern Qt interface with xterm.js terminal" >> RELEASE_NOTES.md
        echo "- Collapsible sidebar with all bridge controls" >> RELEASE_NOTES.md
        echo "- All original functionality (firmware updates, flashing, etc.)" >> RELEASE_NOTES.md
        echo "- Cross-platform support" >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "## Available Platforms:" >> RELEASE_NOTES.md
        echo "- Linux x64" >> RELEASE_NOTES.md
        echo "- macOS Intel" >> RELEASE_NOTES.md
        echo "- macOS Apple Silicon" >> RELEASE_NOTES.md
        echo "- Windows x64" >> RELEASE_NOTES.md
        
    - name: Create combined GUI release
      if: startsWith(github.ref, 'refs/tags/gui-v')
      uses: softprops/action-gh-release@v2
      with:
        files: gui-artifacts/**/*
        body_path: RELEASE_NOTES.md
        tag_name: ${{ github.ref_name }}
        name: "Jumperless Bridge GUI ${{ github.ref_name }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
