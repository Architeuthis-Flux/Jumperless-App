name: Build and Package Jumperless App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Opt in to Node24 for all JS actions (clears the Node20 deprecation warning).
env:
  PYTHON_VERSION: "3.11"
  DISABLE_MACOS_NOTARIZATION: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Linux (AppImage + tar.gz) and Windows (.exe + zip)
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            artifact-name: "Jumperless-Linux-x64"
          - os: windows-latest
            platform: windows
            arch: x64
            artifact-name: "Jumperless-Windows-x64"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prepare jumperless_pkg for build
      run: python Scripts/prepare_jumperless_pkg.py

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.arch }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/AppData/Local/pip/Cache
        key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-${{ matrix.arch }}-pip-

    # --- Linux ---------------------------------------------------------------
    - name: Install system dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfuse2 desktop-file-utils file wget

    - name: Build executable (Linux, bullseye container for low glibc)
      if: matrix.platform == 'linux'
      run: |
        docker run --rm -v "$PWD":/work -w /work python:3.11-bullseye bash -lc '
          set -euo pipefail
          python -m pip install --upgrade pip pyinstaller
          [ -f requirements.txt ] && python -m pip install -r requirements.txt
          python -m PyInstaller --clean --onefile --console \
            --name Jumperless \
            --distpath dist/linux --workpath build/linux \
            --add-data "VERSION:." \
            --exclude-module brotli --exclude-module brotlicffi \
            --icon assets/icons/icon.png \
            JumperlessWokwiBridge.py
        '
        sudo chown -R "$(id -u):$(id -g)" dist build || true

    - name: Package tar.gz fallback (Linux)
      if: matrix.platform == 'linux'
      env:
        PREFER_TARGZ: "true"
      run: python Scripts/package_app.py --platform linux --arch x64 --label "${{ matrix.artifact-name }}"

    - name: Build AppImage (Linux)
      if: matrix.platform == 'linux'
      run: |
        set -euo pipefail
        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        rm -rf Jumperless.AppDir
        mkdir -p Jumperless.AppDir/usr/bin
        cp dist/linux/Jumperless Jumperless.AppDir/usr/bin/Jumperless
        chmod +x Jumperless.AppDir/usr/bin/Jumperless
        cp assets/icons/icon.png Jumperless.AppDir/jumperless.png
        cat > Jumperless.AppDir/jumperless.desktop <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=Jumperless
        Exec=Jumperless
        Icon=jumperless
        Categories=Development;Electronics;
        EOF
        cat > Jumperless.AppDir/AppRun <<'EOF'
        #!/bin/bash
        HERE="$(dirname "$(readlink -f "$0")")"
        exec "$HERE/usr/bin/Jumperless" "$@"
        EOF
        chmod +x Jumperless.AppDir/AppRun
        ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
          Jumperless.AppDir builds/Jumperless-Linux-x86_64.AppImage

    # --- Windows -------------------------------------------------------------
    - name: Install Python dependencies (Windows)
      if: matrix.platform == 'windows'
      run: |
        python -m pip install --upgrade pip pyinstaller
        python -m pip install -r requirements.txt

    - name: Create version info file (Windows)
      if: matrix.platform == 'windows'
      run: python Scripts/create_version_info.py

    - name: Build executable (Windows)
      if: matrix.platform == 'windows'
      run: >
        python -m PyInstaller --clean --onefile --console
        --name Jumperless
        --distpath dist/windows --workpath build/windows
        --add-data "VERSION;."
        --exclude-module brotli --exclude-module brotlicffi
        --version-file version_info.txt
        --icon assets/icons/icon.ico
        JumperlessWokwiBridge.py
      shell: pwsh

    - name: Package zip (Windows)
      if: matrix.platform == 'windows'
      run: python Scripts/package_app.py --platform windows --arch x64 --label "${{ matrix.artifact-name }}"

    # --- Common --------------------------------------------------------------
    - name: Run basic smoke test
      if: matrix.platform == 'linux'
      run: python Scripts/smoke_test.py --platform ${{ matrix.platform }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          builds/Jumperless-*.zip
          builds/Jumperless-*.tar.gz
          builds/Jumperless-*.AppImage
        if-no-files-found: error
        retention-days: 90

    - name: Upload to release (if main or tag)
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          builds/Jumperless-*.zip
          builds/Jumperless-*.tar.gz
          builds/Jumperless-*.AppImage
        tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}"
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # macOS: universal .app -> sign -> notarize -> DMG -> sign+notarize DMG
  # One temp keychain is created up front and kept alive for BOTH the app and
  # the DMG signing, then deleted in a final always() cleanup step.
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prepare jumperless_pkg for build
      run: python3 Scripts/prepare_jumperless_pkg.py

    - name: Cache packager venv
      uses: actions/cache@v4
      with:
        path: venv-packager
        key: macos-packager-${{ hashFiles('VERSION', 'requirements.txt', 'Scripts/setup_universal_python.sh', 'Scripts/install_universal_deps.sh') }}
        restore-keys: macos-packager-

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Import signing certificate
      id: signing
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      run: |
        if [ -z "$MACOS_CERTIFICATE" ]; then
          echo "No signing certificate configured — building unsigned."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        security create-keychain -p temp_pw build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security unlock-keychain -p temp_pw build.keychain
        echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        rm -f certificate.p12
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp_pw build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security default-keychain -s build.keychain
        IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/{print $2; exit}')
        if [ -z "$IDENTITY" ]; then
          echo "Certificate imported but no Developer ID Application identity found." >&2
          exit 1
        fi
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
        echo "signed=true" >> "$GITHUB_OUTPUT"
        echo "Signing identity: $IDENTITY"

    - name: Build macOS app + zip artifact
      run: ./tools/build-macos-installer.sh --ci

    - name: Sign app
      if: steps.signing.outputs.signed == 'true'
      run: |
        codesign --force --deep --options runtime \
          --sign "${{ steps.signing.outputs.identity }}" dist/macos/Jumperless.app
        codesign --verify --verbose dist/macos/Jumperless.app

    - name: Notarize app
      if: steps.signing.outputs.signed == 'true' && env.DISABLE_MACOS_NOTARIZATION != 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        if [ -z "$APPLE_ID" ] || [ -z "$APPLE_ID_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
          echo "Apple notarization credentials not set — skipping app notarization."
          exit 0
        fi
        ditto -c -k --keepParent dist/macos/Jumperless.app Jumperless-app.zip
        xcrun notarytool submit Jumperless-app.zip \
          --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
        xcrun stapler staple dist/macos/Jumperless.app
        rm -f Jumperless-app.zip

    - name: Build installer DMG
      env:
        SKIP_DMG_CODESIGN: ${{ steps.signing.outputs.signed == 'true' && '0' || '1' }}
        JUMPERLESS_DMG_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
      run: ./tools/build-macos-installer.sh --ci --dmg-only

    - name: Notarize DMG
      if: steps.signing.outputs.signed == 'true' && env.DISABLE_MACOS_NOTARIZATION != 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        if [ -z "$APPLE_ID" ] || [ -z "$APPLE_ID_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
          echo "Apple notarization credentials not set — skipping DMG notarization."
          exit 0
        fi
        xcrun notarytool submit builds/Jumperless-Installer.dmg \
          --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
        xcrun stapler staple builds/Jumperless-Installer.dmg

    - name: Run basic smoke test
      run: venv-packager/bin/python Scripts/smoke_test.py --platform macos

    - name: Clean up keychain
      if: always()
      run: security delete-keychain build.keychain || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Jumperless-macOS-Apple-Silicon
        path: |
          builds/Jumperless-*.zip
          builds/Jumperless-*.dmg
        if-no-files-found: error
        retention-days: 90

    - name: Upload to release (if main or tag)
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          builds/Jumperless-*.zip
          builds/Jumperless-*.dmg
        tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}"
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # uv backup launcher bundles (icon + self-update via uv tool upgrade)
  # ---------------------------------------------------------------------------
  build-launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            dirs: "macOS linux"
          - os: windows-latest
            label: Windows
            dirs: "windows"
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install PyInstaller (Windows .exe)
      if: matrix.os == 'windows-latest'
      run: python -m pip install --upgrade pip "pyinstaller>=6.15"

    - name: Build launcher bundles
      run: python tools/build_launcher.py --output-dir dist/launcher

    - name: Zip launcher bundles
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p builds
        for d in ${{ matrix.dirs }}; do
          case "$d" in
            macOS)   (cd dist/launcher/macOS && zip -r -q "$GITHUB_WORKSPACE/builds/Jumperless-Launcher-macOS.zip" Jumperless.app) ;;
            linux)   (cd dist/launcher && zip -r -q "$GITHUB_WORKSPACE/builds/Jumperless-Launcher-Linux.zip" linux) ;;
            windows) powershell -Command "Compress-Archive -Path dist/launcher/windows/* -DestinationPath builds/Jumperless-Launcher-Windows.zip -Force" ;;
          esac
        done
        ls -lh builds/

    - name: Upload launcher artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Jumperless-Launcher-${{ matrix.label }}
        path: builds/Jumperless-Launcher-*.zip
        if-no-files-found: error
        retention-days: 90

    - name: Upload to release (if main or tag)
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: builds/Jumperless-Launcher-*.zip
        tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}"
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Mirror packaged app outputs onto the JumperlessV5 "latest" release, where
  # the firmware.uf2 lives. Only adds/replaces app packages + launchers via
  # --clobber; the release tag, title, notes, and firmware.uf2 are untouched.
  #
  # Requires a JUMPERLESSV5_TOKEN secret (PAT with Contents:write on
  # Architeuthis-Flux/JumperlessV5). Skipped gracefully when absent.
  # ---------------------------------------------------------------------------
  publish-to-jumperlessv5:
    needs: [build, build-macos, build-launcher]
    runs-on: ubuntu-latest
    if: github.repository == 'Architeuthis-Flux/Jumperless-App' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    env:
      JUMPERLESSV5_TOKEN: ${{ secrets.JUMPERLESSV5_TOKEN }}

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Upload app packages onto the JumperlessV5 latest release
      if: ${{ env.JUMPERLESSV5_TOKEN != '' }}
      env:
        GH_TOKEN: ${{ env.JUMPERLESSV5_TOKEN }}
      run: |
        set -euo pipefail
        REPO="Architeuthis-Flux/JumperlessV5"
        mapfile -t FILES < <(find artifacts -type f \( \
          -name 'Jumperless-*.dmg' -o \
          -name 'Jumperless-*.zip' -o \
          -name 'Jumperless-*.tar.gz' -o \
          -name 'Jumperless-*.AppImage' \) | sort)
        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "::error::No app packages found under artifacts/ to upload."
          exit 1
        fi
        echo "Found ${#FILES[@]} package(s) to publish:"
        printf '  %s\n' "${FILES[@]}"
        CUR_TAG="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)"
        if [ -z "$CUR_TAG" ]; then
          echo "::warning::No existing JumperlessV5 release found; skipping upload."
          exit 0
        fi
        echo "Target JumperlessV5 latest release: $CUR_TAG"
        gh release upload "$CUR_TAG" "${FILES[@]}" --repo "$REPO" --clobber
        echo "Published app packages onto $REPO release $CUR_TAG."
